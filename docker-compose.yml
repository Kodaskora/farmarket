version: '3.8'
services:
  mongo:
    image: mongo:6
    ports: ['27017:27017']
    volumes: [mongo_data:/data/db]
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build: ./api
    environment:
      - ./api/.env
    depends_on:
      mongo:
        condition: service_healthy
    ports: ['4000:4000']
    volumes:
      - ./api:/app
      - /app/node_modules

volumes:
  mongo_data:
